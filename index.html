    <!-- Open Graph -->
    <meta property="og:type" content="website" />

    <!-- Twitter / X -->

    <meta name="twitter:title" content="ARENA — Play. Compete. Rise." />

    <meta name="twitter:image" content="%BASE_URL%opengraph.jpg" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />

    <!-- Canonical -->
    <script>
      const canonical = document.createElement("link");
      canonical.rel = "canonical";
      canonical.setAttribute("href", "%BASE_URL%");
      document.head.appendChild(canonical);
    </script>

    <!-- Schema.org JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "/#website",
          "url": "/",
          "name": "ARENA",
          "description": "The sovereign play-to-earn gaming and global voting platform powered by GDN-AI",
          "inLanguage": ["en","ar","fr"],
          "potentialAction": {
            "@type": "SearchAction",
            "target": "/leaderboard",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "VideoGame",
          "@id": "/#game",
          "name": "ARENA",
          "description": "Play-to-earn gaming platform: Neon Racer, Crypto Clash, Arena Strike. Earn virtual coins and climb the leaderboard.",
          "url": "/",
          "applicationCategory": "Game",
          "operatingSystem": "Web Browser",
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD",
            "availability": "https://schema.org/InStock"
          },
          "genre": ["Play-to-Earn","Strategy","Racing","FPS"],
          "featureList": ["Real-time leaderboard","Crypto coin rewards","AI moderation","Multi-language support"],
          "inLanguage": ["en","ar","fr","dz"]
        },
        {
          "@type": "Organization",
          "@id": "/#org",
          "name": "ARENA",
          "url": "/",
          "logo": "/icon-512.png",
          "sameAs": []
        }
      ]
    }
    </script>

    <!-- Fonts: the isolated clip route deliberately avoids this external request. -->
    <script>
      {
        const base = "%BASE_URL%".replace(/\/$/, "");
        const rawRoute = location.pathname.slice(base.length) || "/";
        const route = rawRoute.length > 1 ? rawRoute.replace(/\/+$/, "") : rawRoute;
        const isClipRoute = route === "/clip" || route === "/clips" || /^\/clip\/HELX-\d{6}$/.test(route);
        const isPartnerLite = route === "/partners/operators" || route === "/partners/dashboard";
        const isLite = route === "/lite" || route.startsWith("/lite/") || isPartnerLite;
        const ref = new URLSearchParams(location.search).get("ref");
        const autoLiteRef = ref !== null &&
          ["inwi", "orange", "itissalat", "*6", "star6"].includes(ref.trim().toLowerCase());
        const connection = navigator.connection;
        let limited = false;
        try { limited = localStorage.getItem("gdna.limitedData") === "true"; } catch {}
        limited = limited || !!connection?.saveData || ["2g", "slow-2g"].includes(connection?.effectiveType) ||
          (typeof connection?.downlink === "number" && connection.downlink < 0.5);
      if (!isClipRoute && !isLite && !autoLiteRef && !limited) {
        for (const href of ["https://fonts.googleapis.com", "https://fonts.gstatic.com"]) {
          const connection = document.createElement("link");
          connection.rel = "preconnect";
          connection.href = href;
          if (href.includes("gstatic")) connection.crossOrigin = "";
          document.head.appendChild(connection);
        }
        const font = document.createElement("link");
        font.rel = "stylesheet";
        font.href = "https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap";
        document.head.appendChild(font);
      }
      }
    </script>
  </head>
  <body>
    <aside role="status" style="position:relative;z-index:2147483647;padding:8px;background:#713f12;color:white;text-align:center;font:14px system-ui">Backend migration pending: configure Supabase and restore the Arena API for sessions, GDNA, voting, recovery and withdrawals.</aside>
    <div id="root"></div>
    <script>
      (() => {
        const base = "%BASE_URL%".replace(/\/$/, "");
        const rawRoute = location.pathname.slice(base.length) || "/";
        const route = rawRoute.length > 1 ? rawRoute.replace(/\/+$/, "") : rawRoute;
        if (route === "/clip" || route === "/clips") {
          document.documentElement.lang = "ar";
          document.documentElement.dir = "rtl";
          document.documentElement.style.colorScheme = "dark";
          document.title = "الكليبز — ARENA";
          document.getElementById("root").innerHTML =
            '<main data-testid="clip-shell" aria-busy="true"><h1>الكليبز</h1><p>جارٍ تجهيز الرفع…</p></main>';
        }
      })();
    </script>
    <script type="module" src="%BASE_URL%src/main.tsx"></script>
  </body>
</html>

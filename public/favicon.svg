<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#050505"/>

  <!-- Outer ring -->
  <circle cx="32" cy="32" r="29" stroke="#C9A84C" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="5 3" fill="none"/>

  <!-- Crown shape (flat gold, no gradients) -->
  <polyline points="20,40 20,26 25,31 32,22 39,31 44,26 44,40"
    stroke="#FFD700" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
  <line x1="20" y1="40" x2="44" y2="40" stroke="#FFD700" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Crown jewels -->
  <circle cx="20" cy="40" r="2.5" fill="#FFD700"/>
  <circle cx="32" cy="22" r="3"   fill="#FFD700"/>
  <circle cx="44" cy="40" r="2.5" fill="#FFD700"/>

  <!-- DNA helix left strand (gold) -->
  <path d="M24 40 C30 44 38 48 32 52 C26 56 32 60 32 60"
    stroke="#C9A84C" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- DNA helix right strand (cyan) -->
  <path d="M40 40 C34 44 26 48 32 52 C38 56 32 60 32 60"
    stroke="#00D4FF" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- Rung -->
  <line x1="27" y1="49" x2="37" y2="49" stroke="#C9A84C" stroke-width="1.2" stroke-opacity="0.6"/>
  <circle cx="32" cy="52" r="1.8" fill="#C9A84C" fill-opacity="0.9"/>
</svg>
